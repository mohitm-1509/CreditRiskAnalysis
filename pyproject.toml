[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "credit-risk-analysis"
version = "0.1.0"
description = "End-to-end credit risk analysis with PD/LGD modelling, causal inference, and LLM-powered reporting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.43",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "optuna>=3.4",
    "imbalanced-learn>=0.11",
    "kagglehub>=0.3",
    "google-cloud-bigquery>=3.13",
    "pandas-gbq>=0.19",
    "db-dtypes>=1.1",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "anthropic>=0.39",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "joblib>=1.3",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
    "ruff>=0.1",
]
